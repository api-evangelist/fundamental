aid: fundamental
name: Fundamental
description: Fundamental (Fundamental Technologies Inc.) is an AI company building foundation models for
  tabular data and enterprise decision-making. Its flagship product, NEXUS, is a Large Tabular Model pre-trained
  on billions of real-world enterprise tables that learns which patterns drive which outcomes and delivers
  predictions with a single line of code. Founded by DeepMind alumni and serial entrepreneurs, the company
  raised a $255M Series A in February 2026 and is backed by Kindred Ventures. It targets predictive analytics
  across financial services and other enterprise sectors. Fundamental publishes no public API or developer
  platform yet, so this profile is an identity record rather than a spec-bearing API.
